<input type="number" id="a" > ----- <input type="number" id="b"><br> <input type="number" id="c"> ----- x
<input type="button" value=" Calcular x  " onclick="multiplicaPor2()">
<h1 id="num"></h1>
<script>
function multiplicaPor2() {
    let a = parseFloat(document.getElementById("a").value)
    let b = parseFloat(document.getElementById("b").value)
    let c = parseFloat(document.getElementById("c").value)
    let x = b*c/a
    document.getElementById("num").innerText = `X = ${x}` 
}
</script>
