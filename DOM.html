<input type="number" id="a" > --- <input type="number" id="b"><br>
<input type="button" value=" Calcular + " onclick="some()">
<input type="button" value="calcular * " onclick="multiplique()">
<input type="button"value="calcular - " onclick="subtraia()">
<input type="button"value="calcular / " onclick="divida()">

<h1 id="num"></h1>
<script>
function some() {
    let a = parseFloat(document.getElementById("a").value)
    let b = parseFloat(document.getElementById("b").value)
    let x = a+b

    document.getElementById("num").innerText = `X = ${x}` 
}

function multiplique() {
    let a = parseFloat(document.getElementById("a").value)
    let b = parseFloat(document.getElementById("b").value)
    let x = a*b

    document.getElementById("num").innerText = `X = ${x}` 
}
function subtraia() {
    let a = parseFloat(document.getElementById("a").value)
    let b = parseFloat(document.getElementById("b").value)
    let x = a-b

    document.getElementById("num").innerText = `X = ${x}` 
}
function divida(){
    let a = parseFloat(document.getElementById("a").value)
    let b = parseFloat(document.getElementById("b").value)
    let x = a/b

    document.getElementById("num").innerText = `X = ${x}` 
}
</script>
